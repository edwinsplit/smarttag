<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTag Scanner</title>
</head>
<body>

<h2>SmartTag Scanner</h2>

<button id="scanCamera">Scan QR met camera</button>
<button id="scanPhoto">Scan QR via foto</button>
<button id="scanBLE">Scan via Bluetooth</button>

<br><br>

<input type="file" id="photoInput" accept="image/*" style="display:none">

<video id="preview" width="300" autoplay></video>

<p>Gescande code: <span id="tagId">-</span></p>

Ring: <input id="ring" type="text"><br>
Eigenaar: <input id="owner" type="text"><br><br>

<button id="send">Opslaan</button>

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="scanner.js?v=40"></script>

</body>
</html>
