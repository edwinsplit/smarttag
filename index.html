
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTag QR Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>SmartTag QR‑scanner (iPhone versie)</h2>

<video id="preview" autoplay playsinline></video>
<canvas id="qr-canvas"></canvas>

<button id="startScan">Start QR‑scan</button>

<div id="result">
    <h3>Gescande SmartTag</h3>
    <p><strong>Tag‑ID:</strong> <span id="tagId">—</span></p>

    <label>Ringnummer:</label>
    <input id="ring" type="text" placeholder="1234567‑24">

    <label>Eigenaar:</label>
    <input id="owner" type="text" placeholder="Edwin">

    <button id="send">Opslaan</button>
    <button id="openMap" style="display:none;">Bekijk op kaart</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
<script src="scanner.js"></script>

</body>
</html>
