<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTag Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>SmartTag 1 Scanner</h2>

<video id="preview" autoplay playsinline></video>

<button id="scanCamera">Scan QR met camera</button>
<button id="scanPhoto">Scan QR via foto</button>
<button id="scanBLE">Scan SmartTag via Bluetooth</button>

<div id="result">
    <h3>Resultaat</h3>
    <p><strong>ID:</strong> <span id="tagId">—</span></p>

    <label>Ringnummer:</label>
    <input id="ring" type="text" placeholder="1234567‑24">

    <label>Eigenaar:</label>
    <input id="owner" type="text" placeholder="Edwin">

    <button id="send">Opslaan</button>
</div>

<input type="file" id="photoInput" accept="image/*" style="display:none;">

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="scanner.js"></script>

</body>
</html>
